name: hourly-collect
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: run collector
        run: python3 run_collector.py --sources sources.json --output out
      - name: commit public job data
        run: |
          mkdir -p docs-data
          cp out/raw-irish-queue.json out/last-changes.json out/health.json docs-data/
          git config user.name "ie-jobs-collector-bot"
          git config user.email "actions@github.com"
          git add docs-data/
          git diff --cached --quiet || git commit -m "hourly collector update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
