name: hourly-collect
on:
  push:
    branches: [main]
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
concurrency:
  group: ie-jobs-collector
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          ref: main
          fetch-depth: 1
      - name: refresh queued run base
        run: |
          git fetch --depth=1 --no-tags origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: regression tests
        run: python3 -m unittest discover -s tests -v && python3 -m unittest test_descriptions -v
      - name: skip already-published UTC hour
        id: hour_guard
        run: python3 scripts/hour_guard.py
      - name: restore state
        if: steps.hour_guard.outputs.skip != 'true'
        run: |
          mkdir -p out
          gunzip -c state/state.json.gz > out/state.json 2>/dev/null || echo "no prior state"
      - name: run collector
        if: steps.hour_guard.outputs.skip != 'true'
        run: python3 run_collector.py --sources sources.json --output out
      - name: commit public job data and state
        if: steps.hour_guard.outputs.skip != 'true'
        run: |
          git config user.name "ie-jobs-collector-bot"
          git config user.email "actions@github.com"
          # Keep generated output outside the tracked tree while moving to the
          # latest main. This preserves unrelated commits without merging JSON.
          for attempt in 1 2 3; do
            git fetch --depth=1 --no-tags origin main
            git reset --hard origin/main
            mkdir -p docs-data state
            cp out/raw-irish-queue.json out/last-changes.json out/health.json docs-data/
            gzip -9 -c out/state.json > state/state.json.gz
            git add docs-data/ state/
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "hourly collector update $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          echo "Unable to push collector output after 3 attempts" >&2
          exit 1
